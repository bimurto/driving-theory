<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Secure a breakdown scene</title><desc id="desc">A stopped car uses hazard lights and a warning triangle is positioned at a safe distance behind it.</desc>
