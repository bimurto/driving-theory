<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Set the parking disc to the next half-hour</title><desc id="desc">For an arrival at 10:40, the parking disc is set to 11:00.</desc>
  <rect width="960" height="520" fill="#eaf1f4"/><text x="480" y="58" text-anchor="middle" fill="#06436a" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Set the parking disc to the next half-hour</text>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="220" y="124" fill="#617079" font-size="24">Arrival</text><text x="220" y="170" fill="#172027" font-size="46" font-weight="700">10:40</text><path d="M340 150h120m-28-24 28 24-28 24" fill="none" stroke="#075d93" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
  <circle cx="650" cy="280" r="175" fill="#075d93" stroke="#06436a" stroke-width="10"/><circle cx="650" cy="280" r="145" fill="#fffdfa"/>
  <g fill="#172027" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="middle"><text x="650" y="164">11</text><text x="765" y="290">3</text><text x="650" y="410">6</text><text x="535" y="290">9</text></g>
  <path d="M650 280V174" stroke="#d8872b" stroke-width="13" stroke-linecap="round"/><circle cx="650" cy="280" r="15" fill="#d8872b"/>
  <text x="650" y="490" text-anchor="middle" fill="#075d93" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Display: 11:00</text>
</svg>
